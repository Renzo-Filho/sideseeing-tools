<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="static/css/custom.css?v={{ cache_buster }}">
    <link rel="stylesheet" href="static/css/viewer.css?v={{ cache_buster }}">
    <link rel="stylesheet" href="static/css/dataviz.css?v={{ cache_buster }}">
</head>
<body class="bg-gray-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:relative top-0 left-0 h-full w-64 bg-slate-900 text-white z-40 transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0 flex flex-col">
        <div class="p-6 border-b border-slate-700 flex items-center justify-between">
            <div>
                <div class="font-bold text-xl">SideSeeing</div>
                <div class="text-sm text-gray-500">Viewer</div>
            </div>
            <button id="sidebar-close-btn" class="lg:hidden text-slate-400 hover:text-white">
                <i data-lucide="x"></i>
            </button>
        </div>

        <nav class="p-4 space-y-1 flex-1 overflow-y-auto sidebar-scrollbar">
            <a href="#" data-section="sidewalk-assessment" class="nav-link flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                <i data-lucide="cpu" size="18"></i><span class="font-medium text-sm">Sidewalk Assessment</span>
            </a>
            <a href="#" data-section="video" class="nav-link flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                <i data-lucide="video" size="18"></i><span class="font-medium text-sm">Video Frames</span>
            </a>
            <a href="#" data-section="dataviz" class="nav-link flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                <i data-lucide="eye" size="18"></i><span class="font-medium text-sm">Dataviz</span>
            </a>
            {% if report_url %}
            <a href="{{ report_url }}" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                <i data-lucide="file-text" size="18"></i><span class="font-medium text-sm">Report</span>
            </a>
            {% else %}
            <div class="flex items-center gap-3 px-4 py-3 text-slate-600" title="Run SideSeeingWorkspace.generate_report(), or build_workspace.py with --report">
                <i data-lucide="file-text" size="18"></i><span class="font-medium text-sm">Report not generated</span>
            </div>
            {% endif %}
        </nav>

        <div class="p-6 border-t border-slate-800 text-xs text-slate-500">
            <p>Serving raw frames from this machine.</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 h-full">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center gap-4 sticky top-0 z-10 shrink-0">
            <button id="sidebar-open-btn" class="lg:hidden text-gray-500 hover:text-gray-700">
                <i data-lucide="menu"></i>
            </button>
            <h1 class="text-xl font-semibold text-gray-800">{{ title }}</h1>
        </header>

        <div class="flex-1 overflow-auto p-6 lg:p-10 custom-scrollbar">
            {% include 'sidewalk-assessment.html' %}

            {% include 'video-frames.html' %}

            {% include 'dataviz.html' %}
        </div>
    </main>

    <script>
        const SAMPLES_DATA = {{ samples | tojson }};
        const ANALYSIS_FILES = {{ analysis_files | tojson }};
    </script>
    <script src="static/js/map_utils.js?v={{ cache_buster }}"></script>
    <script src="static/js/sidewalk_assessment.js?v={{ cache_buster }}"></script>
    <script src="static/js/video.js?v={{ cache_buster }}"></script>
    <script src="static/js/dataviz.js?v={{ cache_buster }}"></script>
    <script src="static/js/viewer.js?v={{ cache_buster }}"></script>
</body>
</html>
